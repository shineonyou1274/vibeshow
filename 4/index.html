x-width:76ch;background:var(--sky-soft);border:2px solid #cfe4ff}\n.box.warn{background:var(--warn-soft);border-color:#ffcdc9}\n.box.mint{background:var(--mint-soft);border-color:#bfe9da}\n.box.butter{background:var(--butter-soft);border-color:#ffe39a}\n.box.lav{background:var(--lav-soft);border-color:#ddd3ff}\n.box b.t{display:block;font-size:15px;margin-bottom:3px;color:#4a3d5c}\n.box.warn b.t{color:var(--warn)}\n.box p{margin:4px 0;font-size:15.5px;max-width:none}\n.box p.pathline{margin:2px 0 6px}\n.box p:last-child{margin-bottom:0}\n.box ul{margin:4px 0 0;padding-left:1.15em;font-size:15.5px}\n.box ul li{margin:2px 0}\n.box ul li::marker{color:var(--pink)}\n\n.prompt{margin:14px 0 22px;border:2px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden}\n.prompt .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px 8px 16px;border-bottom:2px dashed var(--line);background:var(--code)}\n.prompt .bar span{font-size:14.5px;font-weight:700;color:#4a3d5c}\n.prompt .bar span small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12.5px}\n.prompt pre{margin:0;padding:14px 16px;font-family:var(--f-body);font-size:15px;line-height:1.9;white-space:pre-wrap;word-break:keep-all;overflow-x:auto;color:#2f2a3a}\nbutton.copy{font:700 13px var(--f-body);background:var(--rail);color:#fff;border:0;border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}\nbutton.copy.done{background:var(--mint);color:#0f4a3a}\nmark.fill{background:var(--butter-soft);color:inherit;border-bottom:2px solid var(--butter);padding:0 3px;border-radius:3px;font-weight:600}\n\n.tbl{overflow-x:auto;margin:14px 0 20px;max-width:100%}\ntable{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px;line-height:1.7;background:var(--paper);border:2px solid var(--line);border-radius:14px;overflow:hidden}\nth,td{border-bottom:1px solid var(--line);padding:10px 14px;text-align:left;vertical-align:top}\ntr:last-child td t}\n  details.tg summary::before{content:\"－\"}\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n}\n@media (max-width:820px){\n  .shell{grid-template-columns:minmax(0,1fr)}\n  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;padding:9px 0;z-index:5;border-right:0;border-bottom:3px dashed #ffd3df}\n  .brand,.grp{display:none}\n  .rail nav{display:flex;overflow-x:auto;gap:4px;padding:0 12px}\n  .rail nav a{padding:6px 12px;white-space:nowrap;border-radius:999px;flex:none;margin:0;font-size:13.5px}\n  .rail nav a::before,.rail nav a::after{display:none}\n  .rail nav a .n{min-width:auto}\n  main{padding-block:22px 48px}\n  section{scroll-margin-top:64px}\n  section p,section .lead,.box,.prompt,details.tg{max-width:none}\n  .blk{grid-template-columns:minmax(0,1fr);gap:4px}\n  .nav2 button{max-width:49%}\n  .head{margin-bottom:16px;padding-bottom:12px}\n  .head h1{font-size:22px}\n  .head p{font-size:14.5px;line-height:1.75}\n  .tools{margin-top:10px}\n  .prompt .bar span small{display:none}\n}\n@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}\n.round{display:flex;gap:8px;margin:14px 0 4px}.round a{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#fff1bd;color:#303047;text-decoration:none;font-weight:800}.round a[aria-current]{background:#bce6d0}.round-help{font-size:11px;color:#6b6370;margin:4px 0 14px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\">\n\n\u003caside class=\"rail\">\n  \u003cdiv class=\"brand\">\n    \u003cdiv class=\"k\">교원 연수 · 피클 편\u003c/div>\n    \u003cb>생각하는 대로,\u003cbr>맡길 수 있는 비서\u003c/b>\n    \u003cspan>초기 설정 5단계 · 기능 7가지 · Q&amp;A\u003c/span>\n  \u003c/div>\n  \u003cnav aria-label=\"회차 이동\" class=\"round\">\u003ca href=\"../\" title=\"1회차\">1\u003c/a>\u003ca href=\"../2/\" title=\"2회차\">2\u003c/a>\u003ca href=\"../3/\" title=\"3회차\">3\u003c/a>\u003ca href=\"./\" aria-current=\"page\" title=\"4회차\">4\u003c/a>\u003c/nav>\u003cp class=\"round-help\">숫자를 누르면 그 회차 자료로 이동\u003c/p>\n  \u003cnav id=\"menu\">\n    \u003ca href=\"#s00\" data-title=\"이 자료 쓰는 법\">\u003cspan class=\"n\">00\u003c/span>이 자료 쓰는 법\u003c/a>\n    \u003cdiv class=\"grp\">\u003cem>1\u003c/em> 초기 설정 · 약 20분\u003c/div>\n    \u003ca href=\"#s01\" data-title=\"설치와 첫 로그인\">\u003cspan class=\"n\">01\u003c/span>설치와 첫 로그인\u003c/a>\n    \u003ca href=\"#s02\" data-title=\"알림 설정\">\u003cspan class=\"n\">02\u003c/span>알림 설정\u003c/a>\n    \u003ca href=\"#s03\" data-title=\"나의 피클 맞추기\">\u003cspan class=\"n\">03\u003c/span>나의 피클 맞추기\u003c/a>\n    \u003ca href=\"#s04\" data-title=\"정보 공개 범위\">\u003cspan class=\"n\">04\u003c/span>정보 공개 범위\u003c/a>\n    \u003ca href=\"#s05\" data-title=\"학생 정보 3원칙\">\u003cspan class=\"n\">05\u003c/span>학생 정보 3원칙\u003c/a>\n    \u003cdiv class=\"grp\">\u003cem>2\u003c/em> 기능 상세 · 7가지\u003c/div>\n    \u003ca href=\"#s06\" data-title=\"일상·출장·길찾기\">\u003cspan class=\"n\">①\u003c/span>일상·출장·길찾기\u003c/a>\n    \u003ca href=\"#s07\" data-title=\"예약한 작업\">\u003cspan class=\"n\">②\u003c/span>예약한 작업\u003c/a>\n    \u003ca href=\"#s08\" data-title=\"문서·파일·보관함\">\u003cspan class=\"n\">③\u003c/span>문서·파일·보관함\u003c/a>\n    \u003ca href=\"#s09\" data-title=\"외부 서비스 연결\">\u003cspan class=\"n\">④\u003c/span>외부 서비스 연결\u003c/a>\n    \u003ca href=\"#s10\" data-title=\"피클 친구\">\u003cspan class=\"n\">⑤\u003c/span>피클 친구\u003c/a>\n    \u003ca href=\"#s11\" data-title=\"기억 관리\">\u003cspan class=\"n\">⑥\u003c/span>기억 관리\u003c/a>\n    \u003ca href=\"#s12\" data-title=\"사용량·한도\">\u003cspan class=\"n\">⑦\u003c/span>사용량·한도\u003c/a>\n    \u003cdiv class=\"grp\">\u003cem>Q\u003c/em> 참고\u003c/div>\n    \u003ca href=\"#s13\" data-title=\"Q&amp;A · 프롬프트 모음\">\u003cspan class=\"n\">Q\u003c/span>Q&amp;A · 프롬프트\u003c/a>\n  \u003c/nav>\n\u003c/aside>\n\n\u003cmain>\n\u003cheader class=\"head\">\n  \u003cdiv class=\"k\">바이브코딩 교원 연수 · 4회차 / 4회차\u003c/div>\n  \u003ch1>피클 \u003cem>초기 설정\u003c/em>과\u003cbr>일곱 가지 기능\u003c/h1>\n  \u003cp>목차에서 번호를 누르면 그 단계만 화면에 나타납니다. 키보드 ← → 로도 넘길 수 있어요. 프롬프트는 복사 버튼으로 가져다 쓰고, 노란색 \u003cmark class=\"fill\">[ ]\u003c/mark> 칸만 우리 학교·학급 상황으로 바꾸면 됩니다. 화면 이름은 피클 앱의 한국어 표기를 그대로 적었어요.\u003c/p>\n  \u003cspan class=\"legend\">노란 칸 \u003cmark class=\"fill\">[이렇게]\u003c/mark> = 내 상황으로 바꿔 넣는 자리\u003c/span>\n  \u003cdiv class=\"tools\">\n    \u003cspan class=\"st\" id=\"prog-t\" aria-live=\"polite\">1 / 14\u003c/span>\n    \u003cbutton type=\"button\" id=\"t-big\" aria-pressed=\"false\">글자 크게\u003c/button>\n    \u003cbutton type=\"button\" id=\"t-print\">전체 인쇄\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"prog\">\u003ci id=\"prog-bar\">\u003c/i>\u003c/div>\n\u003c/header>\n\n\u003c!-- ═══════════ 00 ═══════════ -->\n\u003csection id=\"s00\">\u003cdiv class=\"box warn\">\u003cb class=\"t\">연수 전에 확인해 주세요\u003c/b>\u003cp>실제 학생·학부모 개인정보와 상담·건강 정보는 입력하지 마세요. 2026-11-16 공식 도움말 기준으로 정리했습니다. 기기·계정·앱 버전에 따라 화면이 다를 수 있으며, 결과와 예약 상태는 앱에서 직접 확인하세요. 업무 계정 연결 전 학교의 사용 기준도 확인하세요.\u003c/p>\u003c/div>\n  \u003ch2>\u003cspan class=\"no\">00\u003c/span>이 자료 쓰는 법\u003c/h2>\n  \u003cp class=\"meta\">읽는 데 2분 · 피클을 처음 켜는 사람 기준\u003c/p>\n  \u003cp class=\"lead\">피클은 브라우저에서 쓰는 챗봇이 아니라 \u003cb>폰에 설치하는 AI 비서 앱\u003c/b>이에요. 이 자료는 ① 켜자마자 해 둘 초기 설정 5가지, ② 실제로 맡길 수 있는 기능 7가지, ③ 자주 막히는 곳 — 이 세 가지만 담았습니다.\u003c/p>\n\n  \u003cdiv class=\"cards\">\n    \u003cdiv class=\"card pk\">\u003cdiv class=\"ico\">🧭\u003c/div>\u003cb>왼쪽 목차\u003c/b>\u003cp>번호를 누르면 그 단계만 화면에 나타나요. 폰에서는 위쪽 가로 목차로 바뀝니다.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card bt\">\u003cdiv class=\"ico\">🟡\u003c/div>\u003cb>노란 [ ] 칸\u003c/b>\u003cp>프롬프트에서 내 상황으로 바꿔 넣을 자리예요. 나머지 문장은 그대로 써도 됩니다.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card mt\">\u003cdiv class=\"ico\">📋\u003c/div>\u003cb>복사 버튼\u003c/b>\u003cp>프롬프트 상자 오른쪽 위 ‘복사’를 누르고, 피클 채팅창에 붙여넣으면 끝.\u003c/p>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"box butter\">\n    \u003cb class=\"t\">연수는 스마트폰 앱으로 진행해요\u003c/b>\n    \u003cp>아이폰·안드로이드 앱 기준입니다. \u003cb>폰을 옆에 두고\u003c/b> 따라 해 주세요. 일부 Mac은 앱스토어 호환 조건에 따라 앱을 쓸 수 있습니다. 3D 생명체는 iOS 전용이며, 단색·자음 모습에서는 3D 월드 메뉴가 흐리게 표시되고 입장할 수 없습니다.\u003c/p>\n  \u003c/div>\n\n  \u003ch3>한눈에 보는 순서\u003c/h3>\n  \u003cdiv class=\"cards\">\n    \u003cdiv class=\"card pk\">\u003cdiv class=\"k\">SETUP 5\u003c/div>\u003cb>초기 설정\u003c/b>\u003cp>01 설치와 첫 로그인 · 02 알림 설정 · 03 나의 피클 맞추기 · 04 정보 공개 범위 · 05 학생 정보 3원칙\u003c/p>\u003c/div>\n    \u003cdiv class=\"card sk\">\u003cdiv class=\"k\">WORK 7\u003c/div>\u003cb>기능 상세\u003c/b>\u003cp>① 일상·출장 ② 예약한 작업 ③ 문서·보관함 ④ 외부 연결 ⑤ 피클 친구 ⑥ 기억 ⑦ 사용량\u003c/p>\u003c/div>\n    \u003cdiv class=\"card bt\">\u003cdiv class=\"k\">HELP\u003c/div>\u003cb>막힐 때\u003c/b>\u003cp>13번 Q&amp;A에 증상별로 정리해 뒀습니다. 복사용 프롬프트 모음도 같은 곳에 있어요.\u003c/p>\u003c/div>\n  \u003c/div>\n\n  \u003cp>앱은 아래쪽 탭 네 개로 움직입니다 — \u003cb>기본 채팅\u003c/b>(대화방, 앱을 열면 여기), \u003cb>둘러보기\u003c/b>(맡길 만한 일 카드), \u003cb>보관함\u003c/b>(주고받은 파일·사진), \u003cb>나의 피클\u003c/b>(내 계정과 모든 설정). 화면 왼쪽 위 메뉴 버튼을 누르면 \u003cb>친구\u003c/b>·\u003cb>추가 대화\u003c/b>·\u003cb>검색\u003c/b>이 나옵니다.\u003c/p>\n  \u003cp class=\"meta\" style=\"margin-top:10px\">화면 문구와 메뉴 이름은 앱 버전에 따라 조금 다를 수 있어요. 순서와 위치는 같으니 비슷한 이름을 찾아 눌러 주세요.\u003c/p>\n\u003c/section>\n\n\u003c!-- ═══════════ 01 ═══════════ -->\n\u003csection id=\"s01\" hidden>\n  \u003ch2>\u003cspan class=\"no\">01\u003c/span>설치와 첫 로그인\u003c/h2>\n  \u003cp class=\"meta\">약 3분 · 설치 → 로그인 → 위젯까지\u003c/p>\n  \u003cp class=\"lead\">피클은 한 계정에 대화·기억·연결한 서비스가 계속 쌓이는 개인 비서예요. 그래서 \u003cb>어느 계정으로 로그인했는지\u003c/b>가 첫 번째이자 가장 중요한 설정입니다.\u003c/p>\n\n  \u003ch3>이 순서대로\u003c/h3>\n  \u003col class=\"steps\">\n    \u003cli>폰의 앱스토어(아이폰) 또는 플레이스토어(안드로이드)에서 \u003cb>Pickle\u003c/b>을 설치합니다.\u003c/li>\n    \u003cli>앱을 열고 화면 안내에 따라 로그인합니다. 로그인하면 바로 \u003cb>기본 채팅\u003c/b> 탭이 열려요.\u003c/li>\n    \u003cli>\u003cspan class=\"path\">\u003cb>나의 피클\u003c/b>\u003ci>›\u003c/i>\u003cb>내 계정\u003c/b>\u003c/span> 에서 내 \u003cb>피클 ID\u003c/b>·전화번호·생년월일이 맞는지 확인합니다. 피클 ID는 친구가 나를 찾을 때 쓰는 이름이에요.\u003c/li>\n    \u003cli>홈 화면에서 바로 부르고 싶다면 \u003cspan class=\"path\">\u003cb>나의 피클\u003c/b>\u003ci>›\u003c/i>\u003cb>홈 화면 위젯\u003c/b>\u003c/span> 에서 위젯을 추가합니다. 위젯을 넣으면 이 줄은 목록에서 사라져요.\u003c/li>\n    \u003cli>앱 글자가 영어·일본어로 보이면 \u003cspan class=\"path\">\u003cb>나의 피클\u003c/b>\u003ci>›\u003c/i>\u003cb>언어\u003c/b>\u003c/span> 에서 한국어로 바꿉니다. (아이폰은 폰 설정 앱으로 안내하고, 안드로이드는 앱 안에서 바로 바뀝니다.)\u003c/li>\n  \u003c/ol>\n\n  \u003cdiv class=\"box warn\">\n    \u003cb class=\"t\">공용 기기·학교 계정으로는 로그인하지 마세요\u003c/b>\n    \u003cp>교실 태블릿이나 공용 PC에 로그인해 두면, 다음에 그 기기를 잡는 사람이 내 대화·기억·연결된 메일까지 그대로 볼 수 있습니다.\u003c/p>\n    \u003cp>부득이하게 썼다면 \u003cspan class=\"path\">\u003cb>나의 피클\u003c/b>\u003ci>›\u003c/i>\u003cb>내 계정\u003c/b>\u003ci>›\u003c/i>맨 아래 \u003cb>로그아웃\u003c/b>\u003c/span> 까지 꼭 해 주세요.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"box mint\">\n    \u003cb class=\"t\">계정은 하나로\u003c/b>\n    \u003cp>업무용·개인용으로 나누기보다 한 계정에 “나는 누구이고 무슨 일을 하는 사람인지”를 알려 주는 편이 훨씬 똑똑해집니다. 대신 \u003cb>학생 정보는 넣지 않는 것\u003c/b>이 원칙이에요(→ 05).\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 02 ═══════════ -->\n\u003csection id=\"s02\" hidden>\n  \u003ch2>\u003cspan class=\"no\">02\u003c/span>알림 설정\u003c/h2>\n  \u003cp class=\"meta\">약 2분 · 기본 채팅 / 추가 대화 알림 켜 두기\u003c/p>\n  \u003cp class=\"lead\">피클이 일을 마치고 알려 주는 통로가 알림이에요. 특히 \u003cb>“{이름}하고 다른 피클의 대화”\u003c/b>는 선생님끼리 전언을 주고받을 때 답이 도착했다는 신호라서, 켜 두면 편합니다.\u003c/p>\n\n  \u003cp>\u003cspan class=\"path\">\u003cb>나의 피클\u003c/b>\u003ci>›\u003c/i>\u003cb>알림 설정\u003c/b>\u003c/span> — 맨 위에 전체 스위치, 그 아래 항목별 스위치가 있습니다.\u003c/p>\n\n  \u003cdiv class=\"tbl\">\n    \u003ctable>\n      \u003ctr>\u003cth>항목\u003c/th>\u003cth>켜 두면\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>전체 스위치\u003c/b>(맨 위)\u003c/td>\u003ctd>아래 항목들의 알림을 한 번에 켜고 끕니다. 먼저 이 스위치가 켜져 있어야 해요.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>새 친구 요청\u003c/b>\u003c/td>\u003ctd>누군가 나에게 친구 요청을 보냈을 때 알려 줍니다.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>친구 요청 수락\u003c/b>\u003c/td>\u003ctd>내가 보낸 요청이 받아들여졌을 때 알려 줍니다.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>{이름}하고 다른 피클의 대화\u003c/b>\u003c/td>\u003ctd>내 피클이 친구 피클과 이야기해 답이 왔을 때 알려 줍니다. 전언을 자주 쓸 거라면 꼭 켜 두세요.\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n\n  \u003cdiv class=\"box warn\">\n    \u003cb class=\"t\">전체 스위치는 함부로 끄지 마세요\u003c/b>\n    \u003cp>전체를 끄면 앱 알림이 모두 조용해집니다. 예약한 작업의 결과는 채팅방에 남아 있어 나중에 볼 수 있지만, 예약 알림·브리핑을 알림으로 받고 싶다면 \u003cb>전체는 켜 두고 필요한 항목만\u003c/b> 조정하는 쪽이 안전해요.\u003c/p>\n    \u003cp>알림이 아예 안 온다면 폰 설정의 알림 허용도 함께 확인해 주세요.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 03 ═══════════ -->\n\u003csection id=\"s03\" hidden>\n  \u003ch2>\u003cspan class=\"no\">03\u003c/span>나의 피클 맞추기\u003c/h2>\n  \u003cp class=\"meta\">약 5분 · 이름 · 목소리 · 말투 · 모습\u003c/p>\n  \u003cp class=\"lead\">같은 AI라도 \u003cb>내 이름으로 부르고, 내 말투로 답하는\u003c/b> 순간부터 “내 비서”가 됩니다. 네 가지만 바꾸면 돼요.\u003c/p>\n\n  \u003cp>\u003cspan class=\"path\">\u003cb>기본 채팅\u003c/b> 탭 맨 위 \u003cb>내 캐릭터\u003c/b> 탭\u003ci>›\u003c/i>프로필\u003ci>›\u003c/i>\u003cb>아바타\u003c/b>(또는 연필 배지) 탭\u003ci>›\u003c/i>수정 화면\u003c/span>\u003c/p>\n\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>이름\u003c/b>NAME\u003c/div>\u003cdiv>\u003ch4>부르고 싶은 이름\u003c/h4>\u003cp>“선생님”보다 “달콩”처럼 짧게 부를 이름이 좋아요. 이름을 바꿔도 자음·모양은 그대로입니다.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>목소리\u003c/b>VOICE\u003c/div>\u003cdiv>\u003ch4>통화할 때 들리는 목소리\u003c/h4>\u003cp>목록에서 미리 듣고 하나를 고릅니다. 그 목소리로 피클이 말해요.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>말투\u003c/b>TONE\u003c/div>\u003cdiv>\u003ch4>존댓말 · 편하게\u003c/h4>\u003cp>한국·일본에서만 보이는 항목입니다. 아래 주의 상자를 꼭 읽어 주세요 — 여기서 많이 막힙니다.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>모습\u003c/b>LOOK\u003c/div>\u003cdiv>\u003ch4>단색 · 자음 · 3D 생명체\u003c/h4>\u003cp>\u003cb>모습 변경하기\u003c/b>에서 고릅니다. 단색은 색 원(얼굴 없음), 자음은 ㄱ~ㅎ + \u003cb>맞춤 설정\u003c/b>(모양·재질), 3D 생명체는 아이폰 전용이고 계정당 한 번 뽑을 수 있어요.\u003c/p>\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"box warn\">\n    \u003cb class=\"t\">‘존댓말로 해줘’만 누르면 안 바뀝니다\u003c/b>\n    \u003cp>말투 화면에서 \u003cb>‘존댓말로 해줘’\u003c/b>·\u003cb>‘편하게 해줘’\u003c/b>를 누르면 \u003cb>그 자리의 예시 대화만\u003c/b> 바뀝니다. 실제로 말투를 바꾸려면 그 아래 \u003cb>‘존댓말로 해줘 적용하기’\u003c/b> 버튼을 눌러야 요청이 피클에게 전달돼요.\u003c/p>\n    \u003cp>모습도 같아요. 고른 뒤 오른쪽 위 \u003cb>저장 캡슐\u003c/b>을 눌러야 반영되고, 그냥 뒤로 나가면 저장되지 않습니다.\u003c/p>\n  \u003c/div>\n\n  \u003ch3>말로 알려 주는 첫 자기소개\u003c/h3>\n  \u003cp>맞춤 설정을 마쳤다면, 채팅창에 아래 한 번만 붙여 넣어 두세요. 이후 답의 밀도가 달라집니다.\u003c/p>\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>첫 자기소개\u003csmall>한 번만 붙여 넣기\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>안녕! 나는 \u003cmark class=\"fill\">[○○고]\u003c/mark>에서 \u003cmark class=\"fill\">[진로]\u003c/mark> 수업을 가르치는 교사야. 올해는 \u003cmark class=\"fill\">[1학년]\u003c/mark> \u003cmark class=\"fill\">[6]\u003c/mark>개 반을 맡고 있고, \u003cmark class=\"fill\">[진로연계교육]\u003c/mark> 업무도 같이 해.\n답할 때는 결론부터 짧게 말해 주고, 비교가 필요한 건 표로 정리해 줘. 학교 서류는 \u003cmark class=\"fill\">[A4 세로·여백 20mm]\u003c/mark> 기준으로 만들어 줘.\n앞으로 내 일을 도울 때 이 내용을 기억해 줘.\u003c/pre>\n  \u003c/div>\n  \u003cp>프로필 화면에는 \u003cb>한 일\u003c/b>·\u003cb>예약한 작업\u003c/b>·\u003cb>함께한 추억\u003c/b> 세 칸이 나란히 있습니다. 예약한 작업은 07번, 함께한 추억은 11번에서 자세히 봅니다.\u003c/p>\n\u003c/section>\n\n\u003c!-- ═══════════ 04 ═══════════ -->\n\u003csection id=\"s04\" hidden>\n  \u003ch2>\u003cspan class=\"no\">04\u003c/span>정보 공개 범위 \u003cspan class=\"tm\">가장 중요\u003c/span>\u003c/h2>\n  \u003cp class=\"meta\">약 7분 · 누구에게 어디까지 말할지 정하기\u003c/p>\n  \u003cp class=\"lead\">피클은 내 일정·메일·기억을 알고, 다른 사람의 피클과도 대화합니다. 그래서 \u003cb>“무엇을 말해도 되는지”\u003c/b>를 여기서 먼저 정해 둬야 해요. 오늘 설정 중 가장 중요한 화면입니다.\u003c/p>\n\n  \u003cp>\u003cspan class=\"path\">\u003cb>나의 피클\u003c/b>\u003ci>›\u003c/i>\u003cb>정보 공개 범위 설정\u003c/b>\u003c/span>\u003c/p>\n\n  \u003cdiv class=\"kv\">\n    \u003cdiv>\u003cspan class=\"tagk\">친구\u003c/span>\u003cb>친구의 피클이 물었을 때 말해도 되는 범위.\u003c/b> 이 안에 \u003cb>‘내가 비었는지만 알리기’\u003c/b>가 있어요 — 켜면 일정 질문에 ‘비어 있음 / 바쁨’까지만 답하고, 닫아 둔 캘린더는 열지 않습니다.\u003c/div>\n    \u003cdiv>\u003cspan class=\"tagk\">사람별\u003c/span>\u003cb>특정 사람에게만 다르게.\u003c/b> 같은 부서 동료에게는 업무 일정까지, 지인에게는 아무것도 안 알리기처럼 사람마다 따로 정할 수 있어요.\u003c/div>\n    \u003cdiv>\u003cspan class=\"tagk\">연결\u003c/span>\u003cb>어떤 연결 앱(캘린더·메일 등)의 내용을 다른 사람과의 대화에서 읽어도 되는지.\u003c/b> 연결했다고 내용이 자동으로 공개되지는 않습니다. 읽을 수 있는 것과 말해도 되는 것은 따로예요.\u003c/div>\n    \u003cdiv>\u003cspan class=\"tagk\">절대 공유 안 함\u003c/span>\u003cb>어떤 경우에도 나가지 않는 항목.\u003c/b> 상담·건강·가족 관련처럼 남에게 알려질 이유가 없는 것은 여기에 두세요.\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"tbl\">\n    \u003ctable>\n      \u003ctr>\u003cth>옆자리 선생님 피클이 묻는다면\u003c/th>\u003cth>이렇게 답이 달라집니다\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>“내일 오후에 비어 있어?”\u003c/td>\u003ctd>친구 범위가 열려 있으면 빈 시간을 알려 주고, \u003cb>‘내가 비었는지만 알리기’\u003c/b>가 켜져 있으면 “비어 있음”까지만 답합니다.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>“무슨 회의 있어?”\u003c/td>\u003ctd>사람별 설정에서 이 사람을 ‘비어 있음/바쁨만’으로 두면 회의 이름은 말하지 않습니다.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>“요즘 뭐 준비해?”\u003c/td>\u003ctd>절대 공유 안 함에 넣어 둔 내용은 어떤 질문에도 나가지 않습니다.\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n\n  \u003cdiv class=\"box lav\">\n    \u003cb class=\"t\">이 화면이 조절하는 것 / 하지 않는 것\u003c/b>\n    \u003cp>정보 공개 범위는 \u003cb>사람에게 말하는 범위\u003c/b>를 정합니다. AI가 내 대화를 처리하는 것과, 운영·장애 대응·안전·법적 의무를 위해 권한을 받은 운영진이 기록을 열람하는 것은 이 스위치로 꺼지지 않아요. 내부 열람은 팀 인증을 거치고 기록이 남습니다.\u003c/p>\n  \u003c/div>\n\n  \u003ch3>AI 학습 설정과 정책 시행일\u003c/h3>\u003cdiv class=\"box lav\">\u003cb class=\"t\">현재 적용 방침과 앞으로 적용될 방침을 구분하세요\u003c/b>\u003cp>2026-11-16 확인 기준, \u003ca href=\"https://pickle.com/ko/privacy-policy/2026-11-12\" target=\"_blank\" rel=\"noopener\">11월 12일 시행 방침\u003c/a>은 이용자의 대화·기억·콘텐츠로 AI 모델을 학습하거나 미세 조정하지 않는다고 안내합니다.\u003c/p>\u003cp>\u003ca href=\"https://pickle.com/ko/privacy-policy\" target=\"_blank\" rel=\"noopener\">최신 게시 방침\u003c/a>에는 2026년 12월 8일 시행일과 선택 동의 방식의 자체 모델 학습이 안내되어 있습니다. 이 미래 시행 내용을 현재 적용 중인 것으로 읽지 마세요. 해당 방침에서는 동의 후 기록만 학습 대상이며, 끄면 이후 기록이 제외됩니다. 이미 학습을 마친 모델에서는 개별 기록을 분리해 삭제할 수 없다고 설명합니다.\u003c/p>\u003cp>AI가 답을 만들기 위해 데이터를 처리하는 것과 모델 학습은 다릅니다. 실제 이용 시 적용되는 방침의 시행일, 처리 업체, 보관 기간과 앱 설정을 함께 확인하세요.\u003c/p>\u003c/div>\n  \u003cdiv class=\"box mint\">\n    \u003cb class=\"t\">카드·비밀번호는 따로 보관됩니다\u003c/b>\n    \u003cp class=\"pathline\">\u003cspan class=\"path\">\u003cb>나의 피클\u003c/b>\u003ci>›\u003c/i>\u003cb>결제 수단\u003c/b>\u003c/span>\u003c/p>\n    \u003cp>폰의 암호나 지문·얼굴 인증을 거쳐야 열립니다. 공식 안내에 따르면 카드 번호·CVC는 AI에 전달되지 않지만, 끝 4자리·유효기간·명의자·우편번호는 AI가 읽을 수 있습니다. 저장한 사이트 로그인은 \u003cb>연결된 앱 및 서비스 → 사이트 상세\u003c/b>에서 관리해요.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 05 ═══════════ -->\n\u003csection id=\"s05\" hidden>\n  \u003ch2>\u003cspan class=\"no\">05\u003c/span>학생 정보 3원칙\u003c/h2>\n  \u003cp class=\"meta\">약 3분 · 교사가 지켜야 할 선\u003c/p>\n  \u003cp class=\"lead\">피클은 대화를 기억하고 파일로 만들어 주는 도구입니다. 그래서 한 번 넣은 정보가 \u003cb>대화 · 함께한 추억 · 보관함\u003c/b>에 남아요. 지우는 것보다 \u003cb>처음부터 넣지 않는 것\u003c/b>이 훨씬 쉽습니다.\u003c/p>\n\n  \u003cdiv class=\"cards\">\n    \u003cdiv class=\"card pk\">\u003cdiv class=\"k\">원칙 ①\u003c/div>\u003cb>실제 학생 정보는 넣지 않기\u003c/b>\u003cp>실제 학생의 이름이나 식별 가능한 정보는 입력하지 말고, 연습에는 가상의 사례를 사용하세요.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card bt\">\u003cdiv class=\"k\">원칙 ②\u003c/div>\u003cb>고유식별정보는 넣지 않기\u003c/b>\u003cp>주민번호·생년월일·전화번호·주소 등 개인정보는 입력하지 않습니다. 실제 명단 없이 빈 양식만 만드세요.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card mt\">\u003cdiv class=\"k\">원칙 ③\u003c/div>\u003cb>민감한 내용은 넣지 않기\u003c/b>\u003cp>상담·건강·생활기록 등은 요약하거나 가명으로 바꿔도 특정될 수 있습니다. 실제 사례 대신 가상의 사례를 사용하세요.\u003c/p>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"box warn\">\n    \u003cb class=\"t\">올리지 않는 것\u003c/b>\n    \u003cul>\n      \u003cli>학생 얼굴이 나온 사진 (사진 공유는 되지만, 올린 사진은 보관함과 기억에 남습니다)\u003c/li>\n      \u003cli>학생이 쓴 활동지·상담 기록 원본\u003c/li>\n      \u003cli>학부모 연락처와 상담 내용\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\n  \u003cdiv class=\"box mint\">\n    \u003cb class=\"t\">이름이 꼭 필요한 문서는 마지막에 내가\u003c/b>\n    \u003cp>가정통신문처럼 이름이 들어가야 하는 문서는 \u003cb>이름 칸을 비운 채로\u003c/b> 받아서, 엑셀·한글에서 내가 직접 채우는 방식이 가장 안전합니다. 피클에게는 “이름 칸은 빈칸으로 두고 번호만 넣어 줘”라고 미리 말해 두세요.\u003c/p>\n  \u003c/div>\n\n  \u003ch3>실제 명단 없이 빈 점검표 만들기\u003c/h3>\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>빈 점검표 만들기\u003csmall>05 · 개인정보\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>실제 명단을 입력하지 않고, 번호·제출 여부·메모 칸만 있는 빈 점검표를 엑셀(.xlsx)로 만들어 줘. 인쇄하면 A4 한 장에 들어오게 해 줘.\u003c/pre>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 06 ═══════════ -->\n\u003csection id=\"s06\" hidden>\n  \u003ch2>\u003cspan class=\"no\">①\u003c/span>일상 · 출장 · 길찾기 &amp; 맛집\u003c/h2>\n  \u003cp class=\"meta\">기능 1 / 7 · 오늘 바로 쓸모 있는 기능\u003c/p>\n  \u003cp class=\"lead\">“몇 시까지 어디로 가야 하는데, 어떻게 가지?”를 통째로 맡기는 기능이에요. 피클이 \u003cb>지도 · 날씨 · 검색\u003c/b>을 직접 확인해서 답합니다. 검색 결과를 복사해 오는 게 아니라, \u003cb>내 조건에 맞춰 비교\u003c/b>해서 가져와요.\u003c/p>\n\n  \u003ch3>이런 걸 맡길 수 있어요\u003c/h3>\n  \u003cdiv class=\"cards\">\n    \u003cdiv class=\"card sk\">\u003cdiv class=\"ico\">🚌\u003c/div>\u003cb>출장 동선\u003c/b>\u003cp>“9시 50분까지 도착”을 기준으로 도보·버스·지하철·택시를 시간과 요금으로 비교.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card mt\">\u003cdiv class=\"ico\">🍚\u003c/div>\u003cb>연수장 근처 식당\u003c/b>\u003cp>영업시간·브레이크타임·주차·단체석까지 확인해서 후보 3곳으로.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card bt\">\u003cdiv class=\"ico\">🌤️\u003c/div>\u003cb>날씨 · 미세먼지\u003c/b>\u003cp>기온과 미세먼지로 옷차림·우산까지 한 줄로 정리.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card lv\">\u003cdiv class=\"ico\">🕘\u003c/div>\u003cb>첫차 · 막차\u003c/b>\u003cp>귀가 막차 시간, 소요 시간, 환승 횟수.\u003c/p>\u003c/div>\n  \u003c/div>\n\n  \u003ch3>잘 시키는 법 4가지\u003c/h3>\n  \u003col class=\"steps\">\n    \u003cli>\u003cb>조건을 숫자로\u003c/b> — 시간·인원·예산·도보 몇 분. “근처”보다 “도보 10분 안”이 정확해요.\u003c/li>\n    \u003cli>\u003cb>후보는 3개로\u003c/b> — “3곳만 비교해서 표로”라고 하면 고르기 쉬워집니다.\u003c/li>\n    \u003cli>\u003cb>표로 정리해 달라\u003c/b> — 지도 링크와 함께 표로 받으면 그대로 저장할 수 있어요.\u003c/li>\n    \u003cli>\u003cb>전화가 필요한 곳은 따로 알려 달라\u003c/b> — 단체 예약·주차 확인은 전화가 확실합니다.\u003c/li>\n  \u003c/ol>\n\n  \u003cdiv class=\"box\">\n    \u003cb class=\"t\">매장 사정은 바뀝니다\u003c/b>\n    \u003cp>피클이 영업시간과 예약 가능 여부를 확인해서 알려 주지만, 단체 예약이나 당일 영업 여부는 \u003cb>전화 한 통\u003c/b>이 가장 확실해요. 피클에게 “전화로 확인해야 할 질문 3개를 뽑아 줘”라고 하면 바로 쓸 수 있습니다.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>출장 동선 + 근처 식당\u003csmall>06 · 이동\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>\u003cmark class=\"fill\">[11월 20일]\u003c/mark> \u003cmark class=\"fill\">[연수 도시]\u003c/mark> 연수장에 \u003cmark class=\"fill\">[09:50]\u003c/mark>까지 가야 해.\n\u003cmark class=\"fill\">[도착역]\u003c/mark>에 \u003cmark class=\"fill\">[09:10]\u003c/mark> 도착 기준으로 이동 방법 3가지(도보·버스·택시)를 시간과 요금으로 비교해 줘.\n그다음 연수장에서 도보 \u003cmark class=\"fill\">[10]\u003c/mark>분 안에 있는 \u003cmark class=\"fill\">[한식]\u003c/mark> 식당 3곳을 영업시간·브레이크타임·주차까지 확인해서 표로 정리해 줘.\n전화로 물어봐야 할 것이 있으면 질문 3개만 따로 뽑아 줘.\u003c/pre>\n  \u003c/div>\n  \u003cp>연수 당일 아침에 이 내용을 자동으로 받고 싶다면 → \u003cb>07 예약한 작업\u003c/b>의 반복 브리핑을 쓰세요.\u003c/p>\n\u003c/section>\n\n\u003c!-- ═══════════ 07 ═══════════ -->\n\u003csection id=\"s07\" hidden>\n  \u003ch2>\u003cspan class=\"no\">②\u003c/span>예약한 작업 \u003cspan class=\"tm\">알림 &amp; 전화\u003c/span>\u003c/h2>\n  \u003cp class=\"meta\">기능 2 / 7 · “그때 알려 줘”가 되는 순간\u003c/p>\n  \u003cp class=\"lead\">챗봇과 비서가 갈리는 지점이에요. \u003cb>“내일 아침 7시에 알려 줘”\u003c/b>라고 하면, 그 시각에 피클이 먼저 와서 말을 겁니다.\u003c/p>\n\n  \u003ch3>세 가지 방식\u003c/h3>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>채팅\u003c/b>MESSAGE\u003c/div>\u003cdiv>\u003ch4>채팅 알림\u003c/h4>\u003cp>정한 시각에 채팅방으로 알려 줍니다. 앱을 열면 그대로 남아 있어 놓쳐도 다시 볼 수 있어요.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>전화\u003c/b>CALL\u003c/div>\u003cdiv>\u003ch4>전화 알람\u003c/h4>\u003cp>내 폰으로 걸려오는 예약 전화 알람은 이번 공식 자료 대조에서 확인하지 못했습니다. 앱에서 지원 여부를 먼저 확인하고, 중요한 일정은 기본 알람을 함께 사용하세요.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>반복\u003c/b>DAILY\u003c/div>\u003cdiv>\u003ch4>반복 브리핑\u003c/h4>\u003cp>매일 아침 날씨+일정처럼 반복되는 알림. 한 번 걸어 두면 계속 돌아갑니다.\u003c/p>\u003c/div>\u003c/div>\n\n  \u003ch3>확인 · 수정 · 취소하는 곳\u003c/h3>\n  \u003cp>\u003cspan class=\"path\">\u003cb>기본 채팅\u003c/b> 탭 맨 위 \u003cb>내 캐릭터\u003c/b> 탭\u003ci>›\u003c/i>프로필\u003ci>›\u003c/i>\u003cb>예약한 작업\u003c/b>\u003c/span>\u003c/p>\n  \u003cul class=\"plain\">\n    \u003cli>\u003cb>일회성\u003c/b> 탭 — 한 번만 돌아가는 알람\u003c/li>\n    \u003cli>\u003cb>반복\u003c/b> 탭 — 매일·매주 도는 브리핑\u003c/li>\n    \u003cli>\u003cb>일시중지\u003c/b> 탭 — 잠시 멈춘 것들\u003c/li>\n    \u003cli>항목을 눌러 \u003cb>수정 · 일시중지 · 삭제\u003c/b>. 지난 통화 기록은 \u003cb>메뉴 → 추가 대화\u003c/b>에서 찾습니다.\u003c/li>\n  \u003c/ul>\n\n  \u003cdiv class=\"box warn\">\n    \u003cb class=\"t\">예약한 작업이 건너뛰어질 때\u003c/b>\n    \u003cp>그날 \u003cb>사용량 한도를 다 쓴 상태\u003c/b>라면 예약한 작업은 그 회차를 건너뜁니다(한도가 차면 새 작업도 시작되지 않아요). 정말 중요한 알람은 폰 기본 알람도 함께 걸어 두세요. 한도는 12번에서 설명합니다.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>매일 아침 브리핑\u003csmall>07 · 반복\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>매일 아침 \u003cmark class=\"fill\">[7시]\u003c/mark>에 오늘 \u003cmark class=\"fill\">[우리 지역]\u003c/mark> 날씨(기온·미세먼지)와 내 캘린더 일정 중 시간이 정해진 것만 정리해서 알려 줘.\n비나 눈이 오면 우산을 챙기라고 한 줄 덧붙이고, 오늘 마감인 일이 있으면 맨 위에 표시해 줘.\u003c/pre>\n  \u003c/div>\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>일회성 알림 예약\u003csmall>07 · 알림\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>\u003cmark class=\"fill\">[2026년 11월 20일]\u003c/mark> \u003cmark class=\"fill\">[08시 40분]\u003c/mark>(한국 시간)에 “연수장 이동 10분 전” 알림을 예약해 줘.\n지원되는 알림 방식과 예약된 정확한 날짜·시간을 확인해 줘.\u003c/pre>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 08 ═══════════ -->\n\u003csection id=\"s08\" hidden>\n  \u003ch2>\u003cspan class=\"no\">③\u003c/span>문서 · 파일 만들기 &amp; 보관함\u003c/h2>\n  \u003cp class=\"meta\">기능 3 / 7 · “말로 시키면 파일이 온다”\u003c/p>\n  \u003cp class=\"lead\">일반 챗봇과 가장 크게 다른 점입니다. 활동지·명단·안내문을 \u003cb>말로 시켜서 파일로 받습니다\u003c/b>. 받은 파일은 \u003cb>보관함\u003c/b>에 날짜별로 쌓여요.\u003c/p>\n\n  \u003ch3>말로 만들 수 있는 것\u003c/h3>\n  \u003cdiv class=\"cards\">\n    \u003cdiv class=\"card pk\">\u003cdiv class=\"ico\">📄\u003c/div>\u003cb>PDF 문서\u003c/b>\u003cp>활동지, 가정통신문, 보고서 초안을 요청할 수 있어요. HWPX 생성은 공식 도움말에서 확인되지 않아 워드·PDF로 실습합니다.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card sk\">\u003cdiv class=\"ico\">📝\u003c/div>\u003cb>워드 .docx\u003c/b>\u003cp>계획서, 회의 자료, 학부모 안내문 초안.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card mt\">\u003cdiv class=\"ico\">📊\u003c/div>\u003cb>엑셀 .xlsx\u003c/b>\u003cp>명단, 점검표, 예산표. 인쇄 한 장에 맞추기까지.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card bt\">\u003cdiv class=\"ico\">🖼️\u003c/div>\u003cb>HTML · 이미지\u003c/b>\u003cp>카드뉴스, 안내 이미지, 간단한 표 이미지.\u003c/p>\u003c/div>\n  \u003c/div>\n\n  \u003ch3>시킬 때 꼭 넣을 4가지\u003c/h3>\n  \u003col class=\"steps\">\n    \u003cli>\u003cb>누구에게 · 무엇에 쓰는지\u003c/b> — “고1 진로 수업 50분용”\u003c/li>\n    \u003cli>\u003cb>분량\u003c/b> — A4 2쪽, 문항 5개, 표 3칸\u003c/li>\n    \u003cli>\u003cb>형식\u003c/b> — A4 세로, 여백 20mm, 본문 10pt\u003c/li>\n    \u003cli>\u003cb>저장 형식\u003c/b> — 워드(.docx) / 엑셀(.xlsx) / PDF\u003c/li>\n  \u003c/ol>\n\n  \u003ch3>다시 찾는 곳 — 보관함\u003c/h3>\n  \u003cp>\u003cspan class=\"path\">\u003cb>보관함\u003c/b> 탭\u003ci>›\u003c/i>\u003cb>아티팩트\u003c/b>(문서·HTML) / \u003cb>미디어\u003c/b>(사진·영상)\u003c/span> — 날짜별로 묶여 있습니다. 오른쪽 아래 \u003cb>＋\u003c/b> 버튼을 누르면 “새로 만들어 달라”는 요청 창이 열려요. 대화에서 지나간 파일은 \u003cspan class=\"path\">\u003cb>메뉴\u003c/b>\u003ci>›\u003c/i>\u003cb>검색\u003c/b>\u003c/span> 으로도 찾습니다.\u003c/p>\n\n  \u003cdiv class=\"box butter\">\n    \u003cb class=\"t\">폰에서 한글 파일이 바로 안 열릴 때\u003c/b>\n    \u003cp>요청할 때 \u003cb>“폰에서도 볼 수 있게 PDF와 미리보기 이미지도 같이 만들어 줘”\u003c/b>를 붙여 두세요. 받은 파일은 채팅의 파일 버블에서 바로 열리고, 보관함에도 남습니다.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>수업 활동지(.docx)\u003csmall>08 · 문서\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>\u003cmark class=\"fill\">[고등학교 1학년]\u003c/mark> \u003cmark class=\"fill\">[진로]\u003c/mark> 수업 50분용 활동지를 만들어 줘.\n주제는 “\u003cmark class=\"fill\">[나의 흥미 유형 찾기]\u003c/mark>”, A4 세로 2쪽, 앞쪽은 빈칸 채우기 5문항, 뒤쪽은 모둠 토의 기록표(3칸)로 구성해 줘.\n워드(.docx)로 주고, 폰에서도 바로 보이게 PDF와 미리보기 이미지도 같이 만들어 줘.\u003c/pre>\n  \u003c/div>\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>학급 점검표(.xlsx)\u003csmall>08 · 명단\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>실제 명단을 입력하지 않고 \u003cmark class=\"fill\">[진로활동]\u003c/mark>에 사용할 빈 점검표를 엑셀(.xlsx)로 만들어 줘.\n열은 번호·제출 여부·메모로 해 줘. 실제 학생 정보는 넣지 마.\n인쇄하면 A4 한 장에 들어오게 해 줘.\u003c/pre>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 09 ═══════════ -->\n\u003csection id=\"s09\" hidden>\n  \u003ch2>\u003cspan class=\"no\">④\u003c/span>외부 서비스 연결\u003c/h2>\n  \u003cp class=\"meta\">기능 4 / 7 · 캘린더 · 메일 · 연락처\u003c/p>\n  \u003cp class=\"lead\">피클이 진짜 ‘내 비서’가 되는 지점입니다. 캘린더를 연결하면 아침 브리핑에 내 일정이 들어오고, 메일을 연결하면 마감과 답장할 메일을 찾아 줍니다.\u003c/p>\n\n  \u003cp>\u003cspan class=\"path\">\u003cb>나의 피클\u003c/b>\u003ci>›\u003c/i>\u003cb>연결된 앱 및 서비스\u003c/b>\u003c/span> — 연결된 서비스, 폰의 기기 소스(위치·연락처·캘린더), 저장한 사이트 로그인이 여기 모여 있습니다.\u003c/p>\n\n  \u003ch3>연결하면 자동으로 해 주는 일\u003c/h3>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>캘린더\u003c/b>CAL\u003c/div>\u003cdiv>\u003ch4>일정 · 브리핑 · 마감\u003c/h4>\u003cp>오늘·이번 주 일정을 읽어 브리핑하고, 빈 시간을 확인하고, 마감이 있는 일을 알려 줍니다.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>메일\u003c/b>MAIL\u003c/div>\u003cdiv>\u003ch4>안 읽은 메일 · 답장 초안\u003c/h4>\u003cp>중요한 메일을 골라 주고, 답장 초안을 만들어 줍니다. 보낼지는 내가 결정해요.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>연락처\u003c/b>BOOK\u003c/div>\u003cdiv>\u003ch4>사람별 기억 · 친구 찾기\u003c/h4>\u003cp>연락처에서 피클을 쓰는 사람을 찾아 친구로 제안하고, 사람별로 맥락을 기억합니다.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"blk\">\u003cdiv class=\"tm\">\u003cb>기기\u003c/b>DEVICE\u003c/div>\u003cdiv>\u003ch4>위치 · 폰 캘린더 · 연락처\u003c/h4>\u003cp>지금 있는 곳 기준 길찾기·날씨, 폰에 저장된 일정과 연락처.\u003c/p>\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"box\">\n    \u003cb class=\"t\">연결하면 처음 한 번은 넓게 읽습니다\u003c/b>\n    \u003cp>새 계정을 연결하면 피클이 그 안을 한 번 훑어 “내가 누구이고 무엇을 챙겨야 하는지”를 익힙니다. 이때 읽은 내용이 대화·기억에 남을 수 있으니, \u003cb>업무용 계정은 개인 계정과 분리\u003c/b>해서 연결할지 먼저 판단해 주세요.\u003c/p>\n  \u003c/div>\n\n  \u003ch3>연결 해제\u003c/h3>\n  \u003col class=\"steps\">\n    \u003cli>\u003cspan class=\"path\">\u003cb>나의 피클\u003c/b>\u003ci>›\u003c/i>\u003cb>연결된 앱 및 서비스\u003c/b>\u003c/span> 에서 서비스를 고릅니다.\u003c/li>\n    \u003cli>서비스 상세에서 \u003cb>연결 해제\u003c/b>를 누릅니다. 저장된 인증 정보가 지워지고, 서비스 쪽 해제도 함께 시도합니다.\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"box warn\">\n    \u003cb class=\"t\">해제해도 바로 사라지지 않는 것\u003c/b>\n    \u003cul>\n      \u003cli>이미 열려 있던 \u003cb>브라우저 로그인 세션\u003c/b>은 바로 끝나지 않을 수 있습니다.\u003c/li>\n      \u003cli>그동안 대화·기억에 남은 내용은 \u003cb>그대로 남습니다\u003c/b>.\u003c/li>\n      \u003cli>그래서 “지금 당장 모든 접근을 끊어 달라”는 요청은 연결 해제만으로 완전히 보장되지 않아요. 함께 확인해야 할 화면을 제가 짚어 드릴게요.\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>연결 후 첫 정리\u003csmall>09 · 캘린더\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>내 캘린더에서 이번 주 금요일까지 마감인 일정만 뽑아서 표로 보여 주고, \u003cmark class=\"fill\">[금요일 15시]\u003c/mark>에 “이번 주 마감” 알림을 걸어 줘.\n마감이 없으면 없다고만 말해 줘.\u003c/pre>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 10 ═══════════ -->\n\u003csection id=\"s10\" hidden>\n  \u003ch2>\u003cspan class=\"no\">⑤\u003c/span>피클 친구 &amp; 피클끼리 전언\u003c/h2>\n  \u003cp class=\"meta\">기능 5 / 7 · 사람끼리 채팅창은 없습니다\u003c/p>\n  \u003cp class=\"lead\">피클에는 \u003cb>사람과 사람이 대화하는 채팅창이 없어요\u003c/b>. 친구가 되면 \u003cb>내 피클과 친구 피클이\u003c/b> 이야기합니다. 그래서 “톡 보내기”가 아니라 \u003cb>“○○ 선생님 피클에 전해 줘”\u003c/b>가 됩니다.\u003c/p>\n\n  \u003ch3>친구 추가\u003c/h3>\n  \u003col class=\"steps\">\n    \u003cli>\u003cspan class=\"path\">\u003cb>메뉴\u003c/b>\u003ci>›\u003c/i>\u003cb>친구\u003c/b>\u003c/span> 로 들어갑니다. 처음 한 번은 \u003cb>연락처 연결\u003c/b>을 물어요 — 연결하면 피클을 쓰는 동료를 찾아 줍니다.\u003c/li>\n    \u003cli>오른쪽 위 \u003cb>추가\u003c/b> 버튼에서 \u003cb>전화번호·피클 ID로 검색\u003c/b>, \u003cb>연락처에서 찾기\u003c/b>, \u003cb>내 QR 보여 주기 / 다른 사람의 QR 스캔하기\u003c/b> 중 하나를 고릅니다.\u003c/li>\n    \u003cli>초대는 \u003cb>초대 링크\u003c/b>로 보냅니다. 카카오톡·인스타그램 DM·메시지·스레드로 바로 공유할 수 있어요.\u003c/li>\n    \u003cli>상대가 \u003cb>수락\u003c/b>하면 친구 완료. 친구 상세에서 함께한 기간과 두 피클의 대화를 볼 수 있습니다.\u003c/li>\n  \u003c/ol>\n\n  \u003cdiv class=\"box warn\">\n    \u003cb class=\"t\">초대 링크로 가입했다고 자동으로 친구가 되지는 않아요\u003c/b>\n    \u003cp>가입만으로는 연결되지 않습니다. \u003cb>한쪽이 친구 요청을 보내고 상대가 수락\u003c/b>해야 친구가 됩니다. “링크 보냈는데 안 된다”는 대부분 이 단계예요.\u003c/p>\n  \u003c/div>\n\n  \u003ch3>전언 보내기\u003c/h3>\n  \u003cul class=\"plain\">\n    \u003cli>채팅창에 그냥 말합니다 — “\u003cb>○○ 선생님 피클에 내일 9시 50분 도착한다고 전해 줘\u003c/b>”.\u003c/li>\n    \u003cli>또는 \u003cspan class=\"path\">\u003cb>메뉴\u003c/b>\u003ci>›\u003c/i>\u003cb>친구\u003c/b>\u003ci>›\u003c/i>친구 이름\u003ci>›\u003c/i>\u003cb>{이름}에게 부탁하기\u003c/b>\u003c/span>\u003c/li>\n    \u003cli>답이 오면 채팅으로 알려 주고(02의 알림), 친구 상세에서 두 피클이 나눈 대화를 다시 볼 수 있어요.\u003c/li>\n  \u003c/ul>\n\n  \u003cdiv class=\"box mint\">\n    \u003cb class=\"t\">전언에도 공개 범위가 적용됩니다\u003c/b>\n    \u003cp>무엇을 말해도 되는지는 \u003cb>04 정보 공개 범위\u003c/b>를 따릅니다. 사람별로 범위를 다르게 정해 두면 전언할 때도 그 선을 넘지 않아요. 급한 일·개인적인 일은 피클을 거치지 말고 직접 연락하는 게 좋습니다.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>동료 피클에 전언\u003csmall>10 · 친구\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>\u003cmark class=\"fill\">[옆자리 ○○ 선생님]\u003c/mark> 피클에게 전해 줘:\n“\u003cmark class=\"fill\">[11월 20일]\u003c/mark> 연수 \u003cmark class=\"fill\">[9시 50분]\u003c/mark>까지 도착, 점심은 근처 식당 예약했으니 \u003cmark class=\"fill\">[12시]\u003c/mark>에 로비에서 만나요.”\n답이 오면 알려 주고, 아직 읽지 않았으면 내일 아침에 다시 알려 줘.\u003c/pre>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 11 ═══════════ -->\n\u003csection id=\"s11\" hidden>\n  \u003ch2>\u003cspan class=\"no\">⑥\u003c/span>기억 관리 \u003cspan class=\"tm\">함께한 추억\u003c/span>\u003c/h2>\n  \u003cp class=\"meta\">기능 6 / 7 · 같은 말을 반복하지 않아도 되는 이유\u003c/p>\n  \u003cp class=\"lead\">피클은 대화하며 알게 된 맥락을 기억합니다 — 근무지, 담당 업무, 좋아하는 말투, 자주 쓰는 서식. 그 기억은 \u003cb>함께한 추억\u003c/b>이라는 이름으로 내가 직접 보고 지울 수 있어요.\u003c/p>\n\n  \u003cp>\u003cspan class=\"path\">\u003cb>기본 채팅\u003c/b> 탭 맨 위 \u003cb>내 캐릭터\u003c/b> 탭\u003ci>›\u003c/i>프로필\u003ci>›\u003c/i>\u003cb>함께한 추억\u003c/b>\u003c/span>\u003c/p>\n  \u003cul class=\"plain\">\n    \u003cli>대화에서 알게 된 내용이 한 줄씩 쌓입니다. 항목을 눌러 \u003cb>편집\u003c/b>하거나 \u003cb>삭제\u003c/b>할 수 있어요.\u003c/li>\n    \u003cli>\u003cb>삭제한 기억은 피클의 기억에서 사라집니다.\u003c/b> 되돌릴 수 없으니, 남겨야 할 내용은 보관함 파일로 먼저 받아 두세요.\u003c/li>\n    \u003cli>“그 얘기는 잊어줘”라고 말한 뒤 이 화면에서 지워졌는지 확인하는 것이 가장 확실합니다.\u003c/li>\n  \u003c/ul>\n\n  \u003cdiv class=\"tbl\">\n    \u003ctable>\n      \u003ctr>\u003cth>\u003c/th>\u003cth>무엇을 하는 곳\u003c/th>\u003cth>어디에 있나\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>함께한 추억\u003c/b>\u003c/td>\u003ctd>피클이 \u003cb>나에 대해 기억하는 것\u003c/b>을 보고 고치는 곳\u003c/td>\u003ctd>프로필 → 함께한 추억\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>검색\u003c/b>\u003c/td>\u003ctd>\u003cb>지난 대화·통화 기록\u003c/b>에서 문장을 찾는 곳\u003c/td>\u003ctd>메뉴 → 검색\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>보관함\u003c/b>\u003c/td>\u003ctd>주고받은 \u003cb>파일과 사진\u003c/b>을 찾는 곳\u003c/td>\u003ctd>보관함 탭\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n\n  \u003cdiv class=\"box warn\">\n    \u003cb class=\"t\">민감한 내용은 기억되기 전에 막으세요\u003c/b>\n    \u003cp>학생 상담·건강·가정사처럼 남으면 곤란한 내용은 애초에 넣지 않는 것이 원칙입니다(→ 05). 이미 들어갔다면 함께한 추억에서 지우고, 관련 대화도 정리해 두세요.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>기억 정리 점검\u003csmall>11 · 추억\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>내가 전에 말한 것 중에서 \u003cmark class=\"fill\">[올해 담당 업무]\u003c/mark>와 \u003cmark class=\"fill\">[연수 준비]\u003c/mark>에 관한 것만 모아서 정리해 줘.\n이미 끝난 일은 함께한 추억에서 지워도 되는지 하나씩 물어봐 주고, 내가 “지워”라고 한 것만 지워 줘.\u003c/pre>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 12 ═══════════ -->\n\u003csection id=\"s12\" hidden>\n  \u003ch2>\u003cspan class=\"no\">⑦\u003c/span>사용량 · 한도 관리\u003c/h2>\n  \u003cp class=\"meta\">기능 7 / 7 · 매일 새벽 4시에 초기화\u003c/p>\n  \u003cp class=\"lead\">사용량은 ‘에너지’가 아니라 \u003cb>하루 동안 쓸 수 있는 대화·작업량의 한도\u003c/b>예요. 매일 \u003cb>새벽 4시\u003c/b>에 초기화되고, 급할 때는 \u003cb>초기화 티켓\u003c/b>으로 당길 수 있습니다.\u003c/p>\n\n  \u003cp>\u003cspan class=\"path\">\u003cb>나의 피클\u003c/b> 맨 위 \u003cb>일일 사용량 한도\u003c/b> 카드\u003ci>›\u003c/i>\u003cb>사용량\u003c/b> 화면\u003c/span>\u003c/p>\n\n  \u003cdiv class=\"tbl\">\n    \u003ctable>\n      \u003ctr>\u003cth>항목\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>일일 사용량 한도\u003c/b>\u003c/td>\u003ctd>오늘 쓴 비율과, 한도가 초기화되기까지 남은 시간. \u003cb>매일 새벽 4시\u003c/b>에 0%로 돌아갑니다.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>전체 초기화 티켓\u003c/b>\u003c/td>\u003ctd>오늘 사용량을 \u003cb>0%로\u003c/b> 되돌립니다.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>절반 초기화 티켓\u003c/b>\u003c/td>\u003ctd>오늘 사용량을 \u003cb>50%만큼\u003c/b> 낮춥니다.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>사용 / 구매하기\u003c/b>\u003c/td>\u003ctd>보유한 티켓은 \u003cb>사용\u003c/b>으로 바로 쓰고, 없으면 \u003cb>구매하기\u003c/b>에서 종류별 묶음을 살 수 있어요(가격은 앱 화면에 표시).\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>티켓 추가 획득\u003c/b>\u003c/td>\u003ctd>초대·이벤트 보상 조건은 앱의 현재 안내에서 확인하세요. SNS 후기 보상은 이번 공식 자료 대조에서 확인하지 못했습니다.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>자동 사용 설정\u003c/b>\u003c/td>\u003ctd>자동 사용·사용 순서 메뉴의 지원 여부는 앱에서 확인하세요. 켜기 전 실제 차감 조건을 읽어 보세요.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>티켓 획득 이력\u003c/b>\u003c/td>\u003ctd>티켓이 어디서 언제 들어왔는지.\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n\n  \u003cdiv class=\"box warn\">\n    \u003cb class=\"t\">한도에 닿으면 이렇게 됩니다\u003c/b>\n    \u003cul>\n      \u003cli>채팅 입력창이 꺼지고, 언제 다시 쓸 수 있는지 안내가 뜹니다.\u003c/li>\n      \u003cli>바로 이어서 하려면 안내 카드의 \u003cb>이어서 사용하기\u003c/b> → \u003cb>사용\u003c/b>(티켓)을 누릅니다.\u003c/li>\n      \u003cli>예약한 작업은 그 회차를 \u003cb>건너뜁니다\u003c/b>. 통화·대화로 맡긴 일도 새로 시작되지 않아요.\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\n  \u003cdiv class=\"box mint\">\n    \u003cb class=\"t\">티켓은 아껴 두기도 합니다\u003c/b>\n    \u003cp>공식 안내에 따르면 티켓에는 유효기간이 없습니다. 단, 환불한 구매의 미사용 티켓은 사라집니다. 사용량이 0이면 티켓을 사용할 수 없습니다. \u003cb>한국 계정은 구독 유료 플랜을 판매하지 않지만 티켓은 유료 구매할 수 있습니다.\u003c/b> 사용량은 한국 시간 매일 새벽 4시에 초기화됩니다.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>수업 시연 전 점검\u003csmall>12 · 사용량\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>오늘 내 사용량이 몇 %인지, 남은 한도로 \u003cmark class=\"fill\">[활동지 2개]\u003c/mark>와 \u003cmark class=\"fill\">[빈 점검표 1개]\u003c/mark>를 만들 수 있을지 알려 줘.\n부족하면 어떤 것을 먼저 하는 게 좋을지 순서를 정해 줘.\u003c/pre>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ═══════════ 13 ═══════════ -->\n\u003csection id=\"s13\" hidden>\n  \u003ch2>\u003cspan class=\"no\">Q\u003c/span>Q&amp;A · 복사용 프롬프트\u003c/h2>\n  \u003cp class=\"meta\">막혔을 때 증상으로 찾기 · 프롬프트는 그대로 복사\u003c/p>\n  \u003cp class=\"lead\">“안 돼요”의 대부분은 \u003cb>① 말투 ‘적용하기’를 안 누름 ② 사용량 한도 ③ 공개 범위 미설정\u003c/b> 셋 중 하나입니다. 증상으로 찾아보세요.\u003c/p>\n\n  \u003cdiv class=\"tbl\">\n    \u003ctable>\n      \u003ctr>\u003cth>증상\u003c/th>\u003cth>먼저 볼 곳\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>말투·이름이 안 바뀐다\u003c/td>\u003ctd>말투는 \u003cb>‘적용하기’ 버튼\u003c/b>까지, 모습은 \u003cb>저장 캡슐\u003c/b>까지 눌러야 반영 (03)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>답을 안 해 준다 · 입력창이 꺼졌다\u003c/td>\u003ctd>\u003cb>사용량 한도\u003c/b> 확인 → ‘이어서 사용하기’ (12)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>예약한 작업이 안 돌았다\u003c/td>\u003ctd>프로필 → \u003cb>예약한 작업\u003c/b>의 일시중지 여부 + 그날 사용량 (07)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>파일이 안 열린다\u003c/td>\u003ctd>PDF·이미지도 함께 요청, 보관함에서 다시 받기 (08)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>친구가 안 맺어진다\u003c/td>\u003ctd>초대 링크 가입만으로는 친구 아님 → \u003cb>친구 요청 수락\u003c/b> 필요 (10)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>전언이 안 전해졌다\u003c/td>\u003ctd>04 공개 범위가 막고 있지 않은지, 상대가 친구인지 (10)\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>개인정보가 걱정된다\u003c/td>\u003ctd>\u003cb>정보 공개 범위\u003c/b>와 \u003cb>피클 개선에 함께하기\u003c/b>는 다른 스위치 (04)\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n\n  \u003ch3>자주 막히는 곳\u003c/h3>\n  \u003cdetails class=\"tg\">\u003csummary>‘존댓말로 해줘’를 눌렀는데 말투가 그대로예요\u003c/summary>\u003cdiv class=\"in\">\u003cp>그 화면의 예시 대화만 바뀐 상태입니다. 바로 아래 \u003cb>‘존댓말로 해줘 적용하기’\u003c/b>(또는 ‘편하게 해줘 적용하기’) 버튼을 누르면 요청이 피클에게 전달되고 채팅창이 열립니다.\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>모습을 골랐는데 다음에 보니 원래대로 돌아와 있어요\u003c/summary>\u003cdiv class=\"in\">\u003cp>\u003cb>모습 변경하기\u003c/b>에서 고른 뒤 오른쪽 위 \u003cb>저장 캡슐\u003c/b>을 눌러야 합니다. 그냥 뒤로 나가면 그 선택은 버려져요. 3D 생명체는 아이폰에서만 보이고, 계정당 한 번 뽑을 수 있습니다.\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>PC에서 피클을 쓰고 싶어요\u003c/summary>\u003cdiv class=\"in\">\u003cp>이 연수는 \u003cb>아이폰·안드로이드 앱\u003c/b> 기준입니다. 앱스토어에는 M1 이상·macOS 14 이상 Mac 호환이 표시되어 있습니다. Windows·웹 지원 여부는 공식 안내에서 확인하세요.\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>알림이 하나도 안 와요\u003c/summary>\u003cdiv class=\"in\">\u003cp>① \u003cb>나의 피클 → 알림 설정\u003c/b>의 전체 스위치가 켜져 있는지 ② 폰 설정에서 피클 알림이 허용되어 있는지 확인하세요. 놓친 내용은 채팅방에 그대로 남아 있습니다.\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>예약한 작업이 오늘만 안 돌았어요\u003c/summary>\u003cdiv class=\"in\">\u003cp>그날 \u003cb>사용량 한도\u003c/b>를 다 썼다면 그 회차를 건너뜁니다. \u003cb>예약한 작업\u003c/b> 화면에서 일시중지 상태인지도 함께 확인해 주세요. 중요한 알람은 폰 기본 알람도 같이 걸어 두면 안전합니다.\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>친구 추가가 안 돼요\u003c/summary>\u003cdiv class=\"in\">\u003cp>상대의 \u003cb>피클 ID\u003c/b>나 전화번호가 맞는지 확인하고, 초대 링크로 가입한 경우에는 \u003cb>친구 요청을 보내고 상대가 수락\u003c/b>해야 합니다. 메뉴 → 친구에서 받은 요청 카드가 있는지도 봐 주세요.\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>지난 대화가 사라졌어요\u003c/summary>\u003cdiv class=\"in\">\u003cp>피클에는 대화 목록이 없고 \u003cb>채팅방 하나\u003c/b>입니다. 지난 내용은 \u003cb>메뉴 → 검색\u003c/b>으로 찾고, 주고받은 파일·사진은 \u003cb>보관함\u003c/b>에 날짜별로 남아 있어요.\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>학생 정보가 새어 나갈까 걱정돼요\u003c/summary>\u003cdiv class=\"in\">\u003cp>사람에게 말하는 범위는 \u003cb>정보 공개 범위 설정\u003c/b>으로 조절합니다. 다만 그 화면은 AI 처리나 운영진의 기록 열람을 끄는 스위치가 아니고, 그 둘은 ‘피클 개선에 함께하기’ 설정과 개인정보 처리방침에서 다뤄요. 애초에 \u003cb>학생 실명·고유식별정보를 넣지 않는 것\u003c/b>이 가장 확실한 보호입니다(05).\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>폰을 바꿨는데 기억이 그대로일까요\u003c/summary>\u003cdiv class=\"in\">\u003cp>같은 계정으로 로그인하면 대화·기억이 이어집니다. 다만 \u003cb>연결된 앱·저장한 로그인\u003c/b>이 새 기기에서 그대로 열리는지 \u003cb>나의 피클 → 연결된 앱 및 서비스\u003c/b>에서 한 번 확인해 주세요.\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>로그아웃은 어디서 하나요\u003c/summary>\u003cdiv class=\"in\">\u003cp>\u003cb>나의 피클 → 내 계정\u003c/b> 맨 아래 \u003cb>로그아웃\u003c/b>. 계정 자체를 지우려면 그 아래 \u003cb>계정 삭제하기\u003c/b>입니다.\u003c/p>\u003c/div>\u003c/details>\n  \u003cdetails class=\"tg\">\u003csummary>무엇부터 시켜 보면 좋을까요\u003c/summary>\u003cdiv class=\"in\">\u003cp>\u003cb>둘러보기\u003c/b> 탭에 맡길 만한 일이 카드로 모여 있습니다. 카드를 누른 뒤 \u003cb>시작하기\u003c/b>를 누르면 그 요청이 채팅으로 들어와 바로 시작됩니다. 오늘은 06~08 중 하나만 골라 성공해 보세요.\u003c/p>\u003c/div>\u003c/details>\n\n  \u003ch3>바로 쓰는 프롬프트 4개\u003c/h3>\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>교무 잡무 한 번에\u003csmall>문서\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>다음 세 가지를 한 번에 만들어 줘. ① \u003cmark class=\"fill\">[학부모 안내문]\u003c/mark> 초안(A4 한 쪽 분량, 정중한 문어체) ② 그 내용을 정리한 \u003cmark class=\"fill\">[3]\u003c/mark>칸 표 ③ 안내문에 넣을 제목 후보 3개.\n모두 A4 세로 기준으로 하고, 학생 이름은 빈칸으로 둬. 워드(.docx)와 PDF로 같이 줘.\u003c/pre>\n  \u003c/div>\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>출장 하루 통째로\u003csmall>이동\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>\u003cmark class=\"fill\">[11월 20일]\u003c/mark> \u003cmark class=\"fill\">[연수 도시]\u003c/mark> 출장 하루를 정리해 줘. 집은 \u003cmark class=\"fill\">[우리 지역]\u003c/mark>, 연수는 \u003cmark class=\"fill\">[09:50~16:30]\u003c/mark>이야.\n① 집에서 나설 시각 ② 이동 수단 3가지 비교 ③ 점심 식당 3곳 ④ 귀가 막차 시간 순서로 표로 정리하고, 각 단계마다 알림을 걸 시각도 같이 알려 줘.\u003c/pre>\n  \u003c/div>\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>일정·마감 브리핑\u003csmall>알림\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>매주 \u003cmark class=\"fill\">[월요일]\u003c/mark> 아침 \u003cmark class=\"fill\">[8시]\u003c/mark>에 이번 주 일정을 정리해서 알려 줘. 시간이 정해진 일정, 마감이 있는 일, 준비물이 필요한 일 세 가지로 나눠서.\n금요일 \u003cmark class=\"fill\">[15시]\u003c/mark>에는 아직 안 끝난 일만 다시 알려 줘.\u003c/pre>\n  \u003c/div>\n  \u003cdiv class=\"prompt\">\n    \u003cdiv class=\"bar\">\u003cspan>오늘 맡긴 일 정리\u003csmall>마무리\u003c/small>\u003c/span>\u003cbutton type=\"button\" class=\"copy\">복사\u003c/button>\u003c/div>\n    \u003cpre>오늘 내가 너에게 맡긴 일을 시간순으로 정리하고, 그중 내일 학교에서 이어서 할 일 3개만 뽑아 줘.\n각 항목에 어디에 저장해 뒀는지(보관함 파일 이름)도 같이 적어 줘.\u003c/pre>\n  \u003c/div>\n\n  \u003cdiv class=\"box mint\">\u003cb class=\"t\">공식 안내 · 2026-11-16 확인\u003c/b>\u003cp>\u003ca href=\"https://pickle.com/ko\">피클 공식 사이트\u003c/a> · \u003ca href=\"https://pickle.com/help/chat/archive\">문서·보관함\u003c/a> · \u003ca href=\"https://pickle.com/help/tasks/delegate\">작업 맡기기\u003c/a> · \u003ca href=\"https://pickle.com/help/credits/usage-credits\">사용량\u003c/a> · \u003ca href=\"https://pickle.com/help/credits/reset-tickets\">티켓\u003c/a> · \u003ca href=\"https://pickle.com/help/credits/plans\">플랜\u003c/a> · \u003ca href=\"https://pickle.com/help/privacy/who-can-see\">열람 범위\u003c/a> · \u003ca href=\"https://pickle.com/help/connect/save-card\">결제정보\u003c/a> · \u003ca href=\"https://pickle.com/help/world/start\">3D 월드\u003c/a>\u003c/p>\u003cp>이 안내 HTML은 마지막으로 본 단계와 글자 크기만 이 브라우저에 저장합니다. 서버로 보내지 않으며, 공용 기기에서는 다음 사용자가 설정을 이어받을 수 있습니다.\u003c/p>\u003c/div>\u003cfooter>\n    © 교원 연수용 · 피클 활용 가이드 · 이 자료는 HTML 파일 하나로 만들어졌습니다\u003cbr>\n    화면 이름은 피클 앱의 한국어 표기를 따랐고, 앱 기능은 안내 시점의 화면을 기준으로 정리했습니다.\n  \u003c/footer>\n\u003c/section>\n\u003c/main>\n\u003c/div>\n\u003cscript>\n(function(){\n  \"use strict\";\n  /* ── 단계 전환 ── */\n  var SECTIONS=[].slice.call(document.querySelectorAll(\"main section\"));\n  var LINKS=[].slice.call(document.querySelectorAll(\"#menu a\"));\n  var prev=null,next=null;\n  function label(i){var a=LINKS[i];if(!a)return\"\";var n=a.querySelector(\".n\");return (n?n.textContent:\"\")+\"  \"+(a.getAttribute(\"data-title\")||\"\");}\n  function show(id,push,initial){\n    var i=-1;\n    for(var k=0;k\u003cSECTIONS.length;k++){ if(SECTIONS[k].id===id){i=k;break;} }\n    if(i\u003c0)i=0;\n    SECTIONS.forEach(function(s,k){s.hidden=(k!==i);});\n    LINKS.forEach(function(a,k){a.classList.toggle(\"on\",k===i); if(k===i)a.setAttribute(\"aria-current\",\"step\");else a.removeAttribute(\"aria-current\");});\n    var pt=document.getElementById(\"prog-t\");\n    if(pt)pt.textContent=(i+1)+\" / \"+SECTIONS.length;\n    var pb=document.getElementById(\"prog-bar\");\n    if(pb)pb.style.width=Math.round((i+1)/SECTIONS.length*100)+\"%\";\n    if(push){ try{history.replaceState(null,\"\",\"#\"+SECTIONS[i].id);}catch(e){} }\n    var on=LINKS[i];\n    if(on&&window.innerWidth\u003c=820){ try{on.scrollIntoView({block:\"nearest\",inline:\"center\"});}catch(e){} }\n    try{ localStorage.setItem(\"pickle-guide-last\",SECTIONS[i].id); }catch(e){}\n    var rail=document.querySelector(\".rail\");\n    if(initial||window.innerWidth>820){\n      window.scrollTo({top:0,behavior:\"instant\"});\n    }else{\n      try{ SECTIONS[i].scrollIntoView({block:\"start\",behavior:\"instant\"}); }\n      catch(e){ SECTIONS[i].scrollIntoView(true); }\n    }\n    render();\n  }\n  function buildNav(){\n    SECTIONS.forEach(function(s){\n      if(s.querySelector(\".nav2\"))return;\n      var d=document.createElement(\"div\"); d.className=\"nav2\";\n      var p=document.createElement(\"button\"); p.type=\"button\"; p.setAttribute(\"data-go\",\"prev\"); p.innerHTML=\"\u003csmall>이전\u003c/small>\";\n      var n=document.createElement(\"button\"); n.type=\"button\"; n.className=\"nx\"; n.setAttribute(\"data-go\",\"next\"); n.innerHTML=\"\u003csmall>다음\u003c/small>\";\n      d.appendChild(p); d.appendChild(n); s.appendChild(d);\n    });\n  }\n  function render(){\n    SECTIONS.forEach(function(s,k){\n      var b=s.querySelector(\".nav2 [data-go='prev']\"), n=s.querySelector(\".nav2 [data-go='next']\");\n      if(b){ b.innerHTML=\"\u003csmall>이전\u003c/small>\"+(k>0?label(k-1):\"\"); b.style.visibility=(k===0)?\"hidden\":\"visible\"; }\n      if(n){ n.innerHTML=\"\u003csmall>다음\u003c/small>\"+(k\u003cSECTIONS.length-1?label(k+1):\"\"); n.style.visibility=(k===SECTIONS.length-1)?\"hidden\":\"visible\"; }\n    });\n  }\n  LINKS.forEach(function(a){\n    a.addEventListener(\"click\",function(e){ e.preventDefault(); show(a.getAttribute(\"href\").slice(1),true); });\n  });\n  document.addEventListener(\"click\",function(e){\n    var t=e.target.closest?e.target.closest(\"[data-go]\"):null;\n    if(!t)return;\n    var i=-1; for(var k=0;k\u003cSECTIONS.length;k++){ if(!SECTIONS[k].hidden){i=k;break;} }\n    if(t.getAttribute(\"data-go\")===\"next\"&&i\u003cSECTIONS.length-1){ e.preventDefault(); show(SECTIONS[i+1].id,true); }\n    if(t.getAttribute(\"data-go\")===\"prev\"&&i>0){ e.preventDefault(); show(SECTIONS[i-1].id,true); }\n  });\n  window.addEventListener(\"hashchange\",function(){ if(location.hash) show(location.hash.slice(1),false); });\n  document.addEventListener(\"keydown\",function(e){\n    if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.isContentEditable)return;\n    if(/INPUT|SELECT|TEXTAREA|SUMMARY|BUTTON|A/.test(e.target.tagName))return;\n    var i=-1; for(var k=0;k\u003cSECTIONS.length;k++){ if(!SECTIONS[k].hidden){i=k;break;} }\n    if(e.key===\"ArrowRight\"&&i\u003cSECTIONS.length-1){ show(SECTIONS[i+1].id,true); }\n    if(e.key===\"ArrowLeft\"&&i>0){ show(SECTIONS[i-1].id,true); }\n  });\n\n  /* ── 이전·다음 버튼 만들기 + 시작 절 정하기 ── */\n  buildNav();\n  var start=\"s00\";\n  if(location.hash&&document.getElementById(location.hash.slice(1))) start=location.hash.slice(1);\n  else{ try{ var last=localStorage.getItem(\"pickle-guide-last\"); if(last&&document.getElementById(last))start=last; }catch(e){} }\n  show(start,false,true);\n\n  /* ── 글자 크게 · 전체 인쇄 ── */\n  var big=document.getElementById(\"t-big\");\n  function setBig(on){\n    document.documentElement.classList.toggle(\"big\",on);\n    if(big)big.setAttribute(\"aria-pressed\",on?\"true\":\"false\");\n    try{localStorage.setItem(\"pickle-guide-big\",on?\"1\":\"0\");}catch(e){}\n  }\n  if(big){\n    try{ if(localStorage.getItem(\"pickle-guide-big\")===\"1\")setBig(true); }catch(e){}\n    big.addEventListener(\"click\",function(){ setBig(!document.documentElement.classList.contains(\"big\")); });\n  }\n  var pr=document.getElementById(\"t-print\");\n  if(pr)pr.addEventListener(\"click\",function(){ window.print(); });\n\n  /* ── 프롬프트 복사 ── */\n  function legacyCopy(text){\n    try{\n      var ta=document.createElement(\"textarea\");\n      ta.value=text; ta.setAttribute(\"readonly\",\"\");\n      ta.style.position=\"fixed\"; ta.style.top=\"-1000px\"; ta.style.left=\"0\"; ta.style.opacity=\"0\";\n      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length);\n      var ok=false; try{ ok=document.execCommand(\"copy\"); }catch(e){ ok=false; }\n      document.body.removeChild(ta); return ok;\n    }catch(e){ return false; }\n  }\n  function selectPre(pre){\n    try{\n      var r=document.createRange(); r.selectNodeContents(pre);\n      var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);\n    }catch(e){}\n  }\n  function flash(btn,msg,done){\n    var old=btn.getAttribute(\"data-old\")||btn.textContent;\n    btn.setAttribute(\"data-old\",old);\n    btn.textContent=msg; btn.classList.toggle(\"done\",!!done);\n    clearTimeout(btn._t);\n    btn._t=setTimeout(function(){ btn.textContent=old; btn.classList.remove(\"done\"); btn.removeAttribute(\"data-old\"); },1800);\n  }\n  [].slice.call(document.querySelectorAll(\".prompt\")).forEach(function(box){\n    var btn=box.querySelector(\"button.copy\"), pre=box.querySelector(\"pre\");\n    if(!btn||!pre)return;\n    btn.addEventListener(\"click\",function(){\n      var text=pre.innerText.replace(/\\u00a0/g,\" \").replace(/\\n+$/,\"\");\n      function fail(){ selectPre(pre); flash(btn,\"길게 눌러 복사\",false); }\n      if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){\n        navigator.clipboard.writeText(text).then(function(){ flash(btn,\"복사됨 ✓\",true); },function(){ legacyCopy(text)?flash(btn,\"복사됨 ✓\",true):fail(); });\n      }else{\n        legacyCopy(text)?flash(btn,\"복사됨 ✓\",true):fail();\n      }\n    });\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";var opened=false;function openWhenReady(){if(opened)return true;if(Date.now()<at)return false;opened=true;setTimeout(function(){document.open();document.write(content);document.close();},0);return true;}if(!openWhenReady()){var t=setInterval(function(){if(Date.now()>=at){clearInterval(t);openWhenReady();}},1000);document.addEventListener("visibilitychange",openWhenReady);}})();</script></body></html>
